name: Build iOS App
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }}
        
    - name: Install dependencies
      run: npm ci
        
    - name: Build iOS app
      run: |
        eas build \
          --platform ios \
          --profile ${{ github.event.inputs.profile || 'preview' }} \
          --non-interactive

    # Everything below only runs for a production build — one click builds AND
    # submits to App Store Connect. It's the exact credential handling
    # submit-ios.yml uses on its own (that workflow still exists separately for
    # re-submitting a build without rebuilding it), duplicated here rather than
    # factored out because GitHub Actions has no shared-steps mechanism short of
    # a composite action, and this stays a single readable file.

    # Written to the runner's local disk only — never committed, never logged.
    # Cleaned up in the "always()" step below regardless of submit outcome.
    - name: Write App Store Connect API key
      if: github.event.inputs.profile == 'production'
      run: |
        cat > asc-api-key.p8 << 'EOF'
        ${{ secrets.ASC_API_KEY_P8 }}
        EOF

    # Fails in seconds on a malformed key instead of burning a submit cycle on
    # "Something went wrong", which names nothing. Prints only the key's type
    # and curve — never any key material, and never the secret's length.
    - name: Verify the key parses as PKCS#8
      if: github.event.inputs.profile == 'production'
      run: |
        for v in ASC_API_KEY_ID ASC_API_KEY_ISSUER_ID; do
          if [ -z "${!v}" ]; then
            echo "::error::$v is empty or unset in repo secrets."
            exit 1
          fi
        done
        node -e "
          const fs = require('fs'), crypto = require('crypto');
          const pem = fs.readFileSync('asc-api-key.p8', 'utf8');
          const lines = pem.trimEnd().split('\n');
          if (!/^-----BEGIN PRIVATE KEY-----/.test(pem.trimStart())) {
            console.log('::error::asc-api-key.p8 is missing the PKCS#8 BEGIN armor. ' +
              'Re-store ASC_API_KEY_P8 straight from the file: gh secret set ASC_API_KEY_P8 < AuthKey_XXXXXXXXXX.p8');
            process.exit(1);
          }
          if (lines.length < 4) {
            console.log('::error::asc-api-key.p8 has only ' + lines.length + ' line(s); a real ASC key has 5. ' +
              'The secret lost its line breaks — re-store it with: gh secret set ASC_API_KEY_P8 < AuthKey_XXXXXXXXXX.p8');
            process.exit(1);
          }
          let key;
          try {
            key = crypto.createPrivateKey(pem);
          } catch (e) {
            console.log('::error::asc-api-key.p8 is not a valid PKCS#8 private key (' + e.message + '). ' +
              'This is the same failure EAS reports as \'pkcs8 must be PKCS#8 formatted string\'.');
            process.exit(1);
          }
          if (key.asymmetricKeyType !== 'ec') {
            console.log('::error::Key is ' + key.asymmetricKeyType + ', not ec. An App Store Connect API key is EC P-256 — ' +
              'this looks like a different .p8 (an Apple Push key, perhaps).');
            process.exit(1);
          }
          console.log('Key OK: ' + key.asymmetricKeyType + ' ' + key.asymmetricKeyDetails.namedCurve + ', ' + lines.length + ' PEM lines');
        "
      env:
        ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}

    # eas.json's committed submit.production.ios only carries ascAppId (public,
    # safe to commit). The credential fields are injected here at runtime so
    # they never touch a tracked file — see .claude/skills/ship-ios-build.
    - name: Inject submit credentials into eas.json
      if: github.event.inputs.profile == 'production'
      run: |
        node -e "
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.submit.production.ios.ascApiKeyPath = './asc-api-key.p8';
          eas.submit.production.ios.ascApiKeyId = process.env.ASC_API_KEY_ID;
          eas.submit.production.ios.ascApiKeyIssuerId = process.env.ASC_API_KEY_ISSUER_ID;
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2));
        "
      env:
        ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}

    - name: Submit to App Store Connect
      if: github.event.inputs.profile == 'production'
      run: eas submit --platform ios --profile production --latest --non-interactive

    - name: Clean up credentials
      if: always() && github.event.inputs.profile == 'production'
      run: |
        rm -f asc-api-key.p8
        git checkout -- eas.json
